<!DOCTYPE html>
<html>
  <head>
    <title>position fixed</title>
  </head>
  <body style="height: 3000px;">
    <div style="background-color: black;
    color: white;
    width: 50px;
    bottom: 20px;
    right: 20px;
    position: fixed;">Sticker</div>

  <div style="background-color: green;
  color: white;
  top: 0;
  bottom: 50px;
  right: 0;
  width: 100px;
  position: fixed;">
    Right sidebar
  </div>

  <div style="background-color: rgba(0, 0, 0, 0.8);
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: center;">
  <div style="background-color: white;
  width: 500px;
  height: 100px;
  border-radius: 8px;
  font-family: arial;
  padding: 14px;">
  <div style="font-size: 24px;
  font-weight: bold;">Modal Title</div>
  <div style="padding-top: 14px;
  padding-bottom: 14px;
  font-size: 15px;">This is a modal</div>
  <div><button style="font-weight: bold;">Close</button></div>
</div>
  </div>
  

  </body>
</html>
