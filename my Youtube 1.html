<!DOCTYPE html>
<html>
  <head>
    <title>My Youtube Demo</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

   
   <style>
      p{
        margin-top: 0;
        margin-bottom: 0;
        margin-top: 12px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      .search-bar{
        display: block;

      }

      .video-preview{
        display: inline-block;
        width: 350px;
        vertical-align: top;
        margin-right: 10px;
      }
  
      
      .thumbnail-1{
        width: 350px;
        display: block;
        
      }

      .profile-picture{
        display: inline-block;
        vertical-align: top;
        width: 60px;
      }

      .channel-picture{
        border-radius: 40px;
        margin-top: 12px;
        width: 50px;

      }

      .video-title{
        line-height: 22px;
        font-weight: 600;
        font-size: 15px;
        
      }
      .video-author,
      .video-stats{
        font-size: 12px;
        color: rgb(96, 96, 96);
        line-height: 8px;
      }

      .video-text{
        display: inline-block;
        width: 230px;
        
      }
      .video-info{
      
      }


    </style>
  </head>
  <body>
   <input class="search-bar" type="text" placeholder="Search"> 

<div class="video-preview">
   <div class="thumbnail">
   <img class="thumbnail-1" src="thumbnails/thumbnail-1.webp">
   </div>
    
    <div class="video-info">
   <div class="profile-picture">
    <img class="channel-picture" src="Channel-pictures/channel-1.jpeg">
   </div>

   <div class="video-text">
   <p class="video-title">Talking Tech and AI with Google CEO Sundar Pichai!</p>
   <p class="video-author">Marques Brownlee</p>
   <p class="video-stats">3.4M views &#183; 6 months ago</p>
   </div>
    </div>
</div>

<div class="video-preview">
   <div class="thumbnail">
   <img class="thumbnail-1" src="thumbnails/thumbnail-2.webp">
   </div>
    
    <div class="video-info">
   <div class="profile-picture">
    <img class="channel-picture" src="Channel-pictures/channel-2.jpeg">
   </div>

   <div class="video-text">
   <p class="video-title">Try Not To Laugh Challenge #9</p>
   <p class="video-author">Markiplier</p>
   <p class="video-stats">19M views &#183; 4 years ago</p>
   </div>
    </div>
</div>

  </body>
</html>
