<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 11</title>
  </head>

  <style>
    p{
      margin-top: 0;
      margin-bottom: 0;
    }

    .profile-pic{
      width: 100%;
      
    }
    .page-btn{
      border: none;
      background-color: rgb(83, 62, 218);
      color: white;
      padding: 10px 25px 10px 25px;
      border-radius: 3px;
      
    }
    .af{
      padding-top: 6px;
    }
    .page-stat{
      color: rgb(96, 96, 96);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      font-size: 15px;
      font-weight: 500;
    }
    .page-name{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      font-weight: 700;
      font-size: 18px;
      padding-top: 8px;
      padding-bottom: 4px;}

      .VT{
        display: inline-block;
        width: 30px;
        margin-right: 3px;
      }
      .channel-pic{
        width: 100%;
        border-radius: 15px;
      }
      .mf{
        display: inline-block;
        top: 50%;
        transform: translateY(-50%);
      }
      .page-info{
       box-shadow: -0.8px -0.8px 5px -0.8px rgba(0, 0, 0, 0.7);
       padding-left: 8px;
       padding-bottom: 10px;
       margin-top: -4px;
      }

      .container{
        display: grid;
        grid-template-columns: 200px 200px 200px;
        column-gap: 10px;
        
      }
      
  </style>

  <body>
    <div class="container">

    <div class="page">

    <div class="page-pic">
    <img class="profile-pic" src="Channel-pictures/cat.jpg">
    </div>

    <div class="page-info">

    <p class="page-name">Oliver</p>

    <div class="VT">
      <img class="channel-pic" src="Channel-pictures/channel-8.jpeg">
    </div>

    <div class="mf">
    <p class="page-stat">2 mutual friends</p>
    </div>

    <div class="af">
    <button class="page-btn">Add Friend</button>
    </div>

    </div>
</div>


     <div class="page">

    <div class="page-pic">
    <img class="profile-pic" src="Channel-pictures/cat2.jpg">
    </div>

    <div class="page-info">

    <p class="page-name">Mimi</p>

    <div class="VT">
      <img class="channel-pic" src="Channel-pictures/channel-8.jpeg">
    </div>

    <div class="mf">
    <p class="page-stat">3 mutual friends</p>
    </div>

    <div class="af">
    <button class="page-btn">Add Friend</button>
    </div>

    </div>

</div>


     <div class="page">

    <div class="page-pic">
    <img class="profile-pic" src="Channel-pictures/dog.jpg">
    </div>

    <div class="page-info">

    <p class="page-name">Rex</p>

    <div class="VT">
      <img class="channel-pic" src="Channel-pictures/channel-4.jpeg">
    </div>

    <div class="mf">
    <p class="page-stat">4 mutual friends</p>
    </div>

    <div class="af">
    <button class="page-btn">Add Friend</button>
    </div>

    </div>

    </div>

    </div>
  </body>
</html>
