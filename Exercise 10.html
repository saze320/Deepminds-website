<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 10</title>

    <style>
      p{
        margin-top: 0;
        margin-bottom: 0;
        font-size: 24px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .profile-pic{
        width: 100%;
        border-radius: 40px;

      }
      .page-pic{
        width: 70px;
        margin-right: 8px;
        margin-left: 8px;
        display: inline-block;
        vertical-align: middle;
      }
      .page-text{
        width: 80px; 
        display: inline-block;
        margin-top: 8px;
        vertical-align: middle;
        margin-bottom: 10px;
      }
      .page-author{
        font-weight: 700;
      }
      .page-des{
        color: rgb(96, 96, 96);
        
      }
      .page-button{
        background-color: royalblue;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 12px 16px 12px 16px;
        font-size: 20px;
        margin-right: 10px;
       }
      .link{
        position: absolute;
        top: 50%;
        right: 4px;
        transform: translateY(-50%);
       }

      .layout{
        width: 500px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        position: relative;
      }


    </style>


  </head>

  <body>

    <div class="layout">

    <div class="page-pic">
    <img class="profile-pic" src="Channel-pictures/channel-2.jpeg">
    </div>

    <div class="page-text">
    <p class="page-author">oliver</p>
    <p class="page-des">the cat popular</p>
    </div>

    <div class="link">
    <button class="page-button">Follow</button>
    </div>

    </div>

  </body>
</html>
