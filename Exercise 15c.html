<!DOCTYPE html>
<html>
  <head>
    <title>Online shopping</title>
  </head>
  <body>
    <div style="position: relative;
    width: 300px;
    display: inline-block;">
      <img style="width: 100%;" src="thumbnails/cloth.jpg">
      <div style="font-family: arial;
      font-size: 13px;
      position: absolute;
      top: 6px;
      right: 0;
      background-color: black;
      color: white;
      padding: 8px 12px;">
        20% OFF
      </div>

      <div style="position: absolute;
      background-color: rgba(255, 255, 255, 0.8);
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;">
      <button style="border-width: 1px;
        border-style: solid;
        border-radius: 2px;
        border-color: black;
        padding: 8px 14px;
        font-family: arial;
        font-weight: bold;
        font-size: 13px;
        background-color: white;">Add to Cart</button>
        </div>

        
    </div>
  </body>
</html>
