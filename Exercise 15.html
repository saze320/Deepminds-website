<!DOCTYPE html>
<html>
  <head>
    <title>Position Absolute and Relative</title>
  </head>
  <body style="height: 3000px;">
    <div style="position: absolute;
    top: 10px;
    right: 10px;
    background-color: black;
    color: white;
    font-family: arial;
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 20px;"> X</div>

    <div style="position: fixed;
    background-color: gray;
    bottom: 20px;
    right: 20px;
    width: 320px;
    height: 180px;">
     <div style="position: absolute;
    top: -10px;
    left: -10px;
    background-color: black;
    color: white;
    font-family: arial;
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 20px;"> X</div>
    <div style="position: absolute;
    bottom: 10px;
    right: 10px;
    font-family: roboto, arial;
    font-weight: 500;
    color: white;
    background-color: black;
    padding: 6px;
    border-radius: 2px;">0:29</div>
</div>

  </body>
</html>
