<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 9a</title>

    <style>
      .cat{
        width: 155px;
        height: 150px;
        vertical-align: bottom;
        object-fit: cover;
      }
      .fet{
        background-color: rgb(48, 48, 224);
        color: white;
        width: 100px;
        padding-top: 6px;
        padding-bottom: 6px;
        border: none;
        border-radius: 3px;
        
        
      }
      .fed{
        box-shadow: 1px 1px 10px -3px rgba(0, 0, 0, 0.5);
        width: 150px;
        border-radius: 3px;
        padding-left: 6px;
        padding-right: 0;
        padding-bottom: 8px;
        padding-top: 2px;
        line-height: 6px;
        font-family: arial;
        
      }

      .peg{
        display: inline-block;
        margin-right: 4px;
      }
      .cop{
        font-size: 12px;
      }

    </style>
  </head>
  <body>

    <div class="peg">

    <img class="cat" src="thumbnails/Rhino.webp">

    <div class="fed">
      <p><strong>Oliver</strong></p>
      <p class="cop">2 mutual friends</p>
      <button class="fet">Add Friend</button>
    </div>

    </div>

    <div class="peg">
    <img class="cat" src="thumbnails/thumbnail-1.webp">
    <div class="fed">
      <p><strong>Mimi</strong></p>
      <p class="cop">3 mutual friends</p>
      <button class="fet">Add Friend</button>
    </div>

    </div>
  </body>
</html>
