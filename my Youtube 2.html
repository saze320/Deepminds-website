<!DOCTYPE html>
<html>
  <head>
    <title>youtube-2 demo</title>

    <style>
      p{
        margin-top: 0;
        margin-bottom: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      .search-bar{
        display: block;
      }
      .video-preview{
        display: inline-block;
        width: 400px;
      }
      .thumbnails{
        display: block;
        width: 400px;
      }
      .profile-pic{
        display: inline-block;
        vertical-align: top;
        width: 50px;
        margin-right: 4px;
      }
      .channel-pic{
        width: 100%;
        border-radius: 40px;

      }
      .video-text{
        display: inline-block;
        width: 330px;
      }
      .video-info{
        margin-top: 8px;
      }
      .video-title{
        margin-bottom: 14px;
        font-size: 17px;
        font-weight: 600;
      }
      .video-author,
      .video-stats{
        font-size: 13px;
        color: rgb(96, 96, 96);
        line-height: 18px;
      }
     

    </style>

  </head>
  <body>
    <input class="search-bar" type="text" placeholder="Search">
    
    <div class="video-preview">

    <div class="thumbnail-row">
    <img class="thumbnails" src="thumbnails/thumbnail-3.avif">
    </div>

    <div class="video-info">
    <div class="profile-pic">
    <img class="channel-pic" src="Channel-pictures/channels4_profile.jpg">
    </div>

    <div class="video-text">
    <p class="video-title">ABEJOYE SEASON 9 &#8214 EPISODE EIGHT &#8214 SEASON FINALE </p>
    <p class="video-author">Damilola Mike Bamiloye and Flaming Sword Movies &#10004</p>
    <P class="video-stats">24M views &#183; 1 Week Ago</P>
    </div>

    </div>

    </div>
  </body>
</html>
